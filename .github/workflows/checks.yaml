name: checks

"on":
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        ruby-version:
          - '3.0'
          - '4.0'
        # exclude:
        #   - os: ubuntu-latest
        #     ruby-version: '2.2' # setup-ruby fails to install ruby 2.2 on ubuntu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swiss Ephemeris Sources
        uses: actions/cache@v4
        with:
          path: ext/swisseph/swisseph_src
          key: swisseph-sources-${{ hashFiles('ext/swisseph/CMakeLists.txt') }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Build and Install Gem
        run: rake install

      - name: Run Tests
        run: rake test

  arch-linux:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm ruby ruby-bundler ruby-rake cmake gcc make

      - name: Cache Swiss Ephemeris Sources
        uses: actions/cache@v4
        with:
          path: ext/swisseph/swisseph_src
          key: swisseph-sources-${{ hashFiles('ext/swisseph/CMakeLists.txt') }}

      - name: Build and Install Gem
        run: rake install

      - name: Run Tests
        run: rake test
